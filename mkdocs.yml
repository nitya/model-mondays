# Project information .........................................
site_name: "Model Mondays"
site_url: https://microsoft.github.io/model-mondays
site_author: Nitya Narasimhan
site_description: >-
 Model Mondays helps AI developers build model expertise through practical spotlights and on-demand expert AMAs.

# Repository ..................................................
